services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONPATH: /app:/app/packages
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
