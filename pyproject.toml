[project]
name = "cloudforge-aws"
version = "0.1.0"
description = "A serverless CSV processing platform with reproducible AWS infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3>=1.40,<2", "pydantic>=2.11,<3"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-cov>=6,<8", "moto[s3,dynamodb,sqs]>=5.1,<6", "ruff>=0.12,<1", "mypy>=1.17,<2", "boto3-stubs[s3,dynamodb,sqs,cloudwatch]>=1.40,<2", "fastapi>=0.115,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "python-hcl2>=7,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages"]
addopts = "-ra --strict-markers"
markers = ["live: requires an explicitly selected deployed AWS environment"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "packages"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["apps/api", "apps/worker", "packages/shared"]
